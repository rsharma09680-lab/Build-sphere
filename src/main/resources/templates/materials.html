<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildSphere | Materials</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="logo-mark">BS</div>

        <div>
            <h1>BuildSphere</h1>
            <span>Construction Management</span>
        </div>
    </div>

    <div class="user-area">
        <a href="/dashboard">Dashboard</a>
        <button onclick="logout()">Logout</button>
    </div>

</header>

<main class="dashboard">

    <section class="welcome">

        <div>
            <p class="eyebrow">MATERIAL MANAGEMENT</p>
            <h2>Materials</h2>
            <p>Track construction material stock and usage.</p>
        </div>

    </section>

    <section class="module-card" style="margin-bottom:30px;">

        <h2>Add Material</h2>

        <form th:action="@{/materials/save}"
              th:object="${material}"
              method="post">

            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px;">

                <input type="text"
                       th:field="*{name}"
                       placeholder="Material Name"
                       required
                       style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                <input type="text"
                       th:field="*{category}"
                       placeholder="Category"
                       required
                       style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                <input type="number"
                       th:field="*{quantity}"
                       placeholder="Quantity"
                       required
                       style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                <input type="text"
                       th:field="*{unit}"
                       placeholder="Unit (kg, bag, piece...)"
                       required
                       style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                <input type="number"
                       step="0.01"
                       th:field="*{price}"
                       placeholder="Price"
                       required
                       style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                <select th:field="*{status}"
                        required
                        style="padding:12px;border:1px solid #ddd;border-radius:8px;">

                    <option value="">Select Status</option>
                    <option value="Available">Available</option>
                    <option value="Low Stock">Low Stock</option>
                    <option value="Out of Stock">Out of Stock</option>

                </select>

            </div>

            <button type="submit"
                    style="margin-top:20px;padding:11px 20px;background:#0b2d5c;color:white;border:none;border-radius:8px;">
                + Add Material
            </button>

        </form>

    </section>

    <section class="modules">

        <h2>Material Stock</h2>

        <div class="module-card">

            <div style="overflow-x:auto;">

                <table style="width:100%;border-collapse:collapse;">

                    <thead>

                    <tr style="text-align:left;border-bottom:2px solid #e5e9f2;">

                        <th style="padding:14px;">ID</th>
                        <th style="padding:14px;">Name</th>
                        <th style="padding:14px;">Category</th>
                        <th style="padding:14px;">Quantity</th>
                        <th style="padding:14px;">Unit</th>
                        <th style="padding:14px;">Price</th>
                        <th style="padding:14px;">Status</th>
                        <th style="padding:14px;">Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="m : ${materials}"
                        style="border-bottom:1px solid #e5e9f2;">

                        <td style="padding:14px;" th:text="${m.id}"></td>
                        <td style="padding:14px;" th:text="${m.name}"></td>
                        <td style="padding:14px;" th:text="${m.category}"></td>
                        <td style="padding:14px;" th:text="${m.quantity}"></td>
                        <td style="padding:14px;" th:text="${m.unit}"></td>
                        <td style="padding:14px;" th:text="${m.price}"></td>
                        <td style="padding:14px;" th:text="${m.status}"></td>

                        <td style="padding:14px;">

                            <a th:href="@{/materials/delete/{id}(id=${m.id})}"
                               onclick="return confirm('Delete this material?');"
                               style="color:#b42318;font-weight:600;text-decoration:none;">
                                Delete
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(materials)}">

                        <td colspan="8"
                            style="padding:30px;text-align:center;color:#7a8497;">
                            No materials added yet.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>

<script>
    function logout() {
        window.location.href = "/";
    }
</script>

</body>
</html>
